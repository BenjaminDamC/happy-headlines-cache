# x-axis scaling: two identical ArticleService replicas behind a load balancer.
# The load balancer is the single entry point — the web app never talks to a
# replica directly, so replicas can be added or removed without the client knowing.
events {
    worker_connections 1024;
}

http {
    upstream article-service {
        # round-robin (the nginx default): each request goes to the next replica
        # in turn, spreading load evenly across the x-axis replicas.
        server article-service:4001;
        server article-service-2:4001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://article-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
