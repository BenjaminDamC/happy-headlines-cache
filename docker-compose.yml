# HappyHeadlines — cache layers between the region-replicated services and the
# distant global databases. DLS Compulsory Assignment #1 (W40).
#
# Ported to C# / .NET 9: the services are ASP.NET Core minimal APIs and the
# offline fill is a .NET console worker (both talk Redis + PostgreSQL).

services:
  # --- Global databases (in North America; NOT replicated to regions) ---
  article-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5433:5432"]
    volumes:
      - ./db/init-article.sql:/docker-entrypoint-initdb.d/init.sql:ro

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5434:5432"]
    volumes:
      - ./db/init-comment.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # --- Cache layers ---
  article-cache:
    image: redis:7-alpine
    ports: ["6379:6379"]

  comment-cache:
    image: redis:7-alpine
    ports: ["6380:6379"]

  # --- Hit-ratio dashboard (small monitoring page for the two caches) ---
  dashboard:
    build: ./dashboard
    ports: ["4003:80"]

  # --- Services (replicated per region; talk to the distant DBs via the caches) ---
  article-service:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    ports: ["4001:4001"]
    depends_on: [article-cache, article-db]
    environment:
      REDIS_URL: redis://article-cache:6379
      DATABASE_URL: "Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh"

  # The ArticleCache OFFLINE fill process — periodically copies the latest
  # 14 days of articles into Redis. Runs independently of the service.
  article-fill:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    command: ["dotnet", "/app/fill/ArticleFill.dll"]
    depends_on: [article-cache, article-db]
    environment:
      REDIS_URL: redis://article-cache:6379
      DATABASE_URL: "Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh"
      FILL_INTERVAL_MS: 30000

  comment-service:
    build:
      context: .
      dockerfile: server/comment-service/Dockerfile
    ports: ["4002:4002"]
    depends_on: [comment-cache, comment-db, profanity-service]
    environment:
      REDIS_URL: redis://comment-cache:6379
      DATABASE_URL: "Host=comment-db;Port=5432;Database=comments;Username=hh;Password=hh"
      PROFANITY_URL: http://profanity-service:4006

  # ProfanityService — screens comment text. Its own swimlane: the CommentService
  # calls it over HTTP through a circuit breaker (see W46 fault isolation).
  profanity-service:
    build:
      context: .
      dockerfile: server/profanity-service/Dockerfile
    ports: ["4006:4006"]

  # --- W44: newsletter + subscriber services (fault-isolated swimlanes) ---

  # The subscriber feature's own database — separate from article/comment DBs.
  subscriber-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscribers
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5435:5432"]
    volumes:
      - ./db/init-subscriber.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # The queue: the ONLY coupling between the two services (fault isolation).
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest/guest)

  # Release-toggle backend (FeatureHub). SDK connects to the edge on 8085.
  featurehub:
    image: featurehub/party-server:latest
    restart: always
    volumes:
      - featurehub-h2-data:/db
    ports:
      - "8090:8085"     # edge + admin console (host 8090 -> container 8085)

  # SubscriberService — owns the subscriber DB, publishes to RabbitMQ, and is
  # hidden behind a FeatureHub release toggle ("SubscriberService").
  subscriber-service:
    build:
      context: .
      dockerfile: server/subscriber-service/Dockerfile
    ports: ["4004:4004"]
    depends_on: [subscriber-db, rabbitmq, featurehub]
    environment:
      DATABASE_URL: "Host=subscriber-db;Port=5432;Database=subscribers;Username=hh;Password=hh"
      RABBITMQ_URL: rabbitmq
      FEATUREHUB_URL: "http://featurehub:8085"
      FEATUREHUB_API_KEY: "f47fc1fb-1b86-4982-a6c7-765b2c697258/y3sMWu7TUCQMjy1ZixLNQL8u0KrwWrCKvmSbFac5"

  # NewsletterService — consumes subscriber events from RabbitMQ. No shared DB.
  newsletter-service:
    build:
      context: .
      dockerfile: server/newsletter-service/Dockerfile
    ports: ["4005:4005"]
    depends_on: [rabbitmq]
    environment:
      RABBITMQ_URL: rabbitmq

volumes:
  featurehub-h2-data:
