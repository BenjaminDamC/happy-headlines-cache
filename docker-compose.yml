# HappyHeadlines — cache layers between the region-replicated services and the
# distant global databases. DLS Compulsory Assignment #1 (W40).
#
# Ported to C# / .NET 9: the services are ASP.NET Core minimal APIs and the
# offline fill is a .NET console worker (both talk Redis + PostgreSQL).

services:
  # --- Global databases (in North America; NOT replicated to regions) ---
  article-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5433:5432"]
    volumes:
      - ./db/init-article.sql:/docker-entrypoint-initdb.d/init.sql:ro

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5434:5432"]
    volumes:
      - ./db/init-comment.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # --- Cache layers ---
  article-cache:
    image: redis:7-alpine
    ports: ["6379:6379"]

  comment-cache:
    image: redis:7-alpine
    ports: ["6380:6379"]

  # --- Hit-ratio dashboard (small monitoring page for the two caches) ---
  dashboard:
    image: nginx:alpine
    ports: ["4003:80"]
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro

  # --- Services (replicated per region; talk to the distant DBs via the caches) ---
  article-service:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    ports: ["4001:4001"]
    depends_on: [article-cache, article-db]
    environment:
      REDIS_URL: redis://article-cache:6379
      DATABASE_URL: "Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh"

  # The ArticleCache OFFLINE fill process — periodically copies the latest
  # 14 days of articles into Redis. Runs independently of the service.
  article-fill:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    command: ["dotnet", "/app/fill/ArticleFill.dll"]
    depends_on: [article-cache, article-db]
    environment:
      REDIS_URL: redis://article-cache:6379
      DATABASE_URL: "Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh"
      FILL_INTERVAL_MS: 30000

  comment-service:
    build:
      context: .
      dockerfile: server/comment-service/Dockerfile
    ports: ["4002:4002"]
    depends_on: [comment-cache, comment-db]
    environment:
      REDIS_URL: redis://comment-cache:6379
      DATABASE_URL: "Host=comment-db;Port=5432;Database=comments;Username=hh;Password=hh"
