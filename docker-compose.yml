# HappyHeadlines — cache layers between the region-replicated services and the
# distant global databases. DLS Compulsory Assignment #2 (W46).
#
# C# / .NET 9: the services are ASP.NET Core minimal APIs and the offline fill is
# a .NET console worker. Includes the W44 subscriber/newsletter swimlanes, the W46
# fault isolation (ProfanityService + circuit breaker) and the scale-cube scaling
# (z-axis article sharding + x-axis load balancing).

services:
  # --- Article databases — scaled on the Z-AXIS (sharded by article id) ---
  article-db-1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5433:5432"]
    volumes:
      - ./db/init-article.sql:/docker-entrypoint-initdb.d/init.sql:ro

  article-db-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5436:5432"]
    volumes:
      - ./db/init-article-2.sql:/docker-entrypoint-initdb.d/init.sql:ro

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5434:5432"]
    volumes:
      - ./db/init-comment.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # --- Cache layers ---
  article-cache:
    image: redis:7-alpine
    ports: ["6379:6379"]

  comment-cache:
    image: redis:7-alpine
    ports: ["6380:6379"]

  # --- Hit-ratio dashboard (small monitoring page for the two caches) ---
  dashboard:
    build: ./dashboard
    ports: ["4003:80"]

  # --- Monitoring: distributed tracing (Jaeger) + metrics (Prometheus) ---
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"     # OTLP/gRPC
      - "4318:4318"     # OTLP/HTTP
      - "16686:16686"   # Jaeger UI (http://localhost:16686)

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"     # Prometheus UI (http://localhost:9090)
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # --- Z-axis coordination component: routes an article id to its shard ---
  article-coordinator:
    build:
      context: .
      dockerfile: server/article-coordinator/Dockerfile
    ports: ["4007:4007"]
    environment:
      SHARD_NAMES: article-db-1,article-db-2
      SHARD_CONN_TEMPLATE: "Host={0};Port=5432;Database=articles;Username=hh;Password=hh"

  # --- ArticleService replicas — scaled on the X-AXIS behind the article-lb ---
  article-service:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    ports: ["4001:4001"]
    depends_on: [article-cache, article-db-1, article-db-2, article-coordinator]
    environment:
      REDIS_URL: redis://article-cache:6379
      COORDINATOR_URL: http://article-coordinator:4007

  # Identical replica — same image, same config. The article-lb round-robins
  # between this and article-service (x-axis horizontal scaling).
  article-service-2:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    ports: ["4008:4001"]
    depends_on: [article-cache, article-db-1, article-db-2, article-coordinator]
    environment:
      REDIS_URL: redis://article-cache:6379
      COORDINATOR_URL: http://article-coordinator:4007

  # The x-axis load balancer: single entry point in front of the replicas.
  article-lb:
    image: nginx:alpine
    ports: ["4000:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [article-service, article-service-2]

  # The ArticleCache OFFLINE fill process — periodically copies the latest
  # 14 days of articles (from ALL shards) into Redis. Runs independently.
  article-fill:
    build:
      context: .
      dockerfile: server/article-service/Dockerfile
    command: ["dotnet", "/app/fill/ArticleFill.dll"]
    depends_on: [article-cache, article-db-1, article-db-2]
    environment:
      REDIS_URL: redis://article-cache:6379
      FILL_INTERVAL_MS: 30000
      SHARD_NAMES: article-db-1,article-db-2
      SHARD_CONN_TEMPLATE: "Host={0};Port=5432;Database=articles;Username=hh;Password=hh"

  comment-service:
    build:
      context: .
      dockerfile: server/comment-service/Dockerfile
    ports: ["4002:4002"]
    depends_on: [comment-cache, comment-db, profanity-service]
    environment:
      REDIS_URL: redis://comment-cache:6379
      DATABASE_URL: "Host=comment-db;Port=5432;Database=comments;Username=hh;Password=hh"
      PROFANITY_URL: http://profanity-service:4006

  # ProfanityService — screens comment text. Its own swimlane: the CommentService
  # calls it over HTTP through a circuit breaker (W46 fault isolation).
  profanity-service:
    build:
      context: .
      dockerfile: server/profanity-service/Dockerfile
    ports: ["4006:4006"]

  # --- W44: newsletter + subscriber services (fault-isolated swimlanes) ---

  # The subscriber feature's own database — separate from article/comment DBs.
  subscriber-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscribers
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports: ["5435:5432"]
    volumes:
      - ./db/init-subscriber.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # The queue: the ONLY coupling between the two services (fault isolation).
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest/guest)

  # Release-toggle backend (FeatureHub). SDK connects to the edge on 8085.
  featurehub:
    image: featurehub/party-server:latest
    restart: always
    volumes:
      - featurehub-h2-data:/db
    ports:
      - "8090:8085"     # edge + admin console (host 8090 -> container 8085)

  # SubscriberService — owns the subscriber DB, publishes to RabbitMQ, and is
  # hidden behind a FeatureHub release toggle ("SubscriberService").
  subscriber-service:
    build:
      context: .
      dockerfile: server/subscriber-service/Dockerfile
    ports: ["4004:4004"]
    depends_on: [subscriber-db, rabbitmq, featurehub]
    environment:
      DATABASE_URL: "Host=subscriber-db;Port=5432;Database=subscribers;Username=hh;Password=hh"
      RABBITMQ_URL: rabbitmq
      FEATUREHUB_URL: "http://featurehub:8085"
      FEATUREHUB_API_KEY: "f47fc1fb-1b86-4982-a6c7-765b2c697258/y3sMWu7TUCQMjy1ZixLNQL8u0KrwWrCKvmSbFac5"

  # NewsletterService — consumes subscriber events from RabbitMQ. No shared DB.
  newsletter-service:
    build:
      context: .
      dockerfile: server/newsletter-service/Dockerfile
    ports: ["4005:4005"]
    depends_on: [rabbitmq, featurehub]
    environment:
      RABBITMQ_URL: rabbitmq
      FEATUREHUB_URL: "http://featurehub:8085"
      FEATUREHUB_API_KEY: "f47fc1fb-1b86-4982-a6c7-765b2c697258/y3sMWu7TUCQMjy1ZixLNQL8u0KrwWrCKvmSbFac5"

volumes:
  featurehub-h2-data:
