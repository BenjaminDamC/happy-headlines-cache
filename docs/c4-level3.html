<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HappyHeadlines C4 — Level 3 (ArticleService components)</title>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  svg{display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" width="1200" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="20" y="34" font-size="24" font-weight="bold" fill="#222">ArticleService — C4 Level 3 (Components)</text>

  <!-- Container boundary -->
  <rect x="40" y="60" width="880" height="600" rx="10" fill="#eef4fb" stroke="#1168bd" stroke-width="2"/>
  <text x="60" y="90" font-size="15" font-weight="bold" fill="#1168bd">Container: ArticleService (C# / .NET 9)</text>

  <!-- Components -->
  <rect x="70" y="110" width="240" height="70" rx="6" fill="#85bbf0"/>
  <text x="190" y="142" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">HTTP API</text>
  <text x="190" y="162" font-size="11" fill="#222" text-anchor="middle">Minimal API endpoints</text>

  <rect x="70" y="230" width="240" height="70" rx="6" fill="#85bbf0"/>
  <text x="190" y="262" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Cache Reader</text>
  <text x="190" y="282" font-size="11" fill="#222" text-anchor="middle">Redis read-through</text>

  <rect x="70" y="350" width="240" height="70" rx="6" fill="#85bbf0"/>
  <text x="190" y="382" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Coordinator Client</text>
  <text x="190" y="402" font-size="11" fill="#222" text-anchor="middle">id → shard (HttpClient)</text>

  <rect x="70" y="470" width="240" height="70" rx="6" fill="#85bbf0"/>
  <text x="190" y="502" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Shard Readers</text>
  <text x="190" y="522" font-size="11" fill="#222" text-anchor="middle">Npgsql per shard</text>

  <rect x="70" y="570" width="240" height="70" rx="6" fill="#85bbf0"/>
  <text x="190" y="602" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Telemetry</text>
  <text x="190" y="622" font-size="11" fill="#222" text-anchor="middle">OTLP + Prometheus + logs</text>

  <!-- Arrows between components -->
  <line x1="190" y1="180" x2="190" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="300" x2="190" y2="350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="385" x2="360" y2="385" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="420" x2="190" y2="470" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- External dependencies (right) -->
  <rect x="480" y="120" width="220" height="54" rx="6" fill="#999"/>
  <text x="590" y="152" font-size="13" fill="#fff" text-anchor="middle">ArticleCache (Redis)</text>

  <rect x="480" y="360" width="220" height="54" rx="6" fill="#999"/>
  <text x="590" y="392" font-size="13" fill="#fff" text-anchor="middle">ArticleCoordinator</text>

  <g>
    <ellipse cx="590" cy="490" rx="85" ry="16" fill="#438dd5"/>
    <rect x="505" y="490" width="170" height="42" rx="4" fill="#438dd5"/>
    <ellipse cx="590" cy="532" rx="85" ry="16" fill="#2a6db0"/>
    <text x="590" y="516" font-size="12" fill="#fff" text-anchor="middle">ArticleDB shards</text>
  </g>

  <rect x="480" y="570" width="220" height="54" rx="6" fill="#999"/>
  <text x="590" y="602" font-size="13" fill="#fff" text-anchor="middle">Jaeger / Prometheus</text>

  <!-- Arrows to external -->
  <line x1="310" y1="155" x2="480" y2="147" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="385" x2="480" y2="387" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="505" x2="505" y2="511" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="605" x2="480" y2="597" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
  <g font-size="12" fill="#555">
    <rect x="950" y="120" width="16" height="16" fill="#85bbf0"/>
    <text x="974" y="133">Component</text>
    <rect x="950" y="146" width="16" height="16" fill="#438dd5"/>
    <text x="974" y="159">Database shard</text>
    <rect x="950" y="172" width="16" height="16" fill="#999"/>
    <text x="974" y="185">External container</text>
  </g>

  <text x="60" y="678" font-size="12" fill="#666">
    Read path: HTTP API → Cache Reader → (miss) Coordinator Client → ArticleCoordinator → Shard Readers → shard DB.
  </text>
</svg>
</body>
</html>
